name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ktlint
        run: ./gradlew :kiit-inputs:ktlintCheck

      - name: detekt
        run: ./gradlew :kiit-inputs:detekt

      - name: JVM tests (commonTest)
        run: ./gradlew :kiit-inputs:jvmTest

  ios-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # SKIE's Swift-side compile step needs Xcode/swiftc/xcrun, not just Gradle — a macOS
      # runner, same requirement every other kiit KMP module needs.
      - name: iOS simulator tests (commonTest)
        run: ./gradlew :kiit-inputs:iosSimulatorArm64Test

  ts-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/kiit-inputs-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
